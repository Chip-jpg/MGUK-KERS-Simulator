<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Laboratorio interattivo sull’induzione elettromagnetica: dalla legge di Faraday-Neumann-Lenz al sistema MGU-K / KERS."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:," />
    <title>KERS Lab — Dall’induzione di Faraday all’MGU-K</title>
    <script>
      // Apply the stored/system theme before first paint (no flash). Mirrors src/core/theme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('kers-lab.theme');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>KERS Lab richiede JavaScript attivo.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

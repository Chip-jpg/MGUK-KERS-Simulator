# Builds the Windows desktop app (Tauri 2: NSIS .exe + MSI) from the Vite build.
# Runs on release tags (v*) and manually from the Actions tab. The installers are
# uploaded as workflow artifacts; on tags a second job attaches them to the GitHub
# Release of that tag (creating it if missing). See docs/DESKTOP.md.
name: Desktop (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri build` runs `npm run build` (beforeBuildCommand), embeds ../dist and
      # produces src-tauri/target/release/bundle/{nsis,msi}/.
      - name: Build desktop app
        run: npm run desktop:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kers-lab-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach installers to the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: kers-lab-windows
          path: installers

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*.exe
            installers/**/*.msi
          fail_on_unmatched_files: true

<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup — Telemetria auto</title>
    <link rel="stylesheet" href="../src/styles/index.css" />
    <link rel="stylesheet" href="./mockup.css" />
    <script>
      document.documentElement.dataset.theme = location.hash === '#light' ? 'light' : 'dark';
      addEventListener('hashchange', () => location.reload());
    </script>
    <style>
      /* --q-heat is added by U1 (dark #ff9248, light #a8420a); fallback for this mockup. */
      :root {
        --mk-heat: var(--q-heat, #ff9248);
      }
      :root[data-theme='light'] {
        --mk-heat: var(--q-heat, #a8420a);
      }
      .mk-svg {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="mk-bar">
      <h1>Telemetria (F2): v, a, P, SoC su asse tempo comune</h1>
      <a href="#dark">Scuro</a> · <a href="#light">Chiaro</a> ·
      <a href="./index.html">Indice</a>
    </div>

    <div class="sim-plots__body" style="max-width: 46rem">
      <div class="telemetry">
        <figure class="plot telemetry__plot">
          <figcaption class="plot__title">Velocità v [km/h]</figcaption>
          <svg class="mk-svg" viewBox="0 0 400 70" role="img" aria-label="Velocità">
            <line class="mk-grid-line" x1="40" y1="35" x2="395" y2="35" />
            <line class="mk-axis" x1="40" y1="5" x2="40" y2="65" />
            <text x="2" y="12">300</text>
            <text x="14" y="66">0</text>
            <polyline
              fill="none"
              stroke="var(--color-neutral)"
              stroke-width="2"
              points="40,40 90,20 150,12 200,30 240,52 290,45 340,22 395,15"
            />
            <line
              x1="240"
              y1="5"
              x2="240"
              y2="65"
              stroke="var(--color-border-strong)"
              stroke-dasharray="2 2"
            />
            <text x="244" y="14">frenata</text>
          </svg>
        </figure>
        <figure class="plot telemetry__plot">
          <figcaption class="plot__title">Accelerazione a [m/s²] · asse destro in g</figcaption>
          <svg class="mk-svg" viewBox="0 0 400 70" role="img" aria-label="Accelerazione">
            <line class="mk-grid-line" x1="40" y1="35" x2="395" y2="35" />
            <line class="mk-axis" x1="40" y1="5" x2="40" y2="65" />
            <line class="mk-axis" x1="395" y1="5" x2="395" y2="65" />
            <text x="10" y="12">+20</text>
            <text x="10" y="66">−40</text>
            <text x="18" y="38">0</text>
            <polyline
              fill="none"
              stroke="var(--q-f)"
              stroke-width="2"
              points="40,22 90,25 150,32 200,48 240,60 290,40 340,26 395,30"
            />
          </svg>
        </figure>
        <figure class="plot telemetry__plot">
          <figcaption class="plot__title">Potenza [kW] · — P MGU-K · - - P freni</figcaption>
          <svg class="mk-svg" viewBox="0 0 400 70" role="img" aria-label="Potenze">
            <line class="mk-grid-line" x1="40" y1="35" x2="395" y2="35" />
            <line class="mk-axis" x1="40" y1="5" x2="40" y2="65" />
            <text x="2" y="12">+120</text>
            <text x="2" y="66">−120</text>
            <polyline
              fill="none"
              stroke="var(--q-energy)"
              stroke-width="2"
              points="40,10 120,10 160,35 200,35 220,60 290,60 300,35 340,10 395,10"
            />
            <polyline
              fill="none"
              stroke="var(--mk-heat)"
              stroke-width="2"
              stroke-dasharray="6 4"
              points="40,35 200,35 220,12 290,8 300,35 395,35"
            />
          </svg>
        </figure>
        <figure class="plot telemetry__plot">
          <figcaption class="plot__title">Stato di carica SoC [%]</figcaption>
          <svg class="mk-svg" viewBox="0 0 400 80" role="img" aria-label="Stato di carica">
            <line class="mk-grid-line" x1="40" y1="35" x2="395" y2="35" />
            <line class="mk-axis" x1="40" y1="5" x2="40" y2="65" />
            <line class="mk-axis" x1="40" y1="65" x2="395" y2="65" />
            <text x="10" y="12">100</text>
            <text x="22" y="66">0</text>
            <polyline
              fill="none"
              stroke="var(--q-energy)"
              stroke-width="2"
              stroke-dasharray="2 3"
              points="40,20 120,30 200,40 220,40 290,28 300,28 395,42"
            />
            <text x="36" y="78">0</text>
            <text x="125" y="78">5</text>
            <text x="210" y="78">10</text>
            <text x="300" y="78">15</text>
            <text x="370" y="78">t [s]</text>
          </svg>
        </figure>
      </div>
    </div>
    <p class="mk-caption">
      Una card, quattro grafici impilati; tacche e etichetta del tempo solo sull'ultimo. Linea
      verticale tratteggiata = evento (markEvent).
    </p>
  </body>
</html>
